name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run core tests
        run: node --test

      - name: Configure secure remote storage
        env:
          TEACHFLOW_SYNC_BRIDGE_URL: ${{ vars.TEACHFLOW_SYNC_BRIDGE_URL || 'https://script.google.com/macros/s/AKfycbzVBEE-P-S7u_81bUy6ozbPk1EjUEF80aNNkNK4qiYWRwN2A1NLS246QYIw6mB8qnwq/exec' }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ vars.GOOGLE_SHEETS_SPREADSHEET_ID || '1yUdarf1y3g2MpH5ZzkDktsfmeJjxSYYCsfxQ3PCWCvQ' }}
        run: >-
          node -e "const fs=require('fs');const config={apiUrl:process.env.TEACHFLOW_SYNC_BRIDGE_URL||'',spreadsheetId:process.env.GOOGLE_SHEETS_SPREADSHEET_ID||''};fs.writeFileSync('dist/remote-config.js','window.__TEACHFLOW_GOOGLE_CONFIG__ = '+JSON.stringify(config)+';\n')"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
