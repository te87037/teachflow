<!doctype html>
<html>
<head><base target="_top"><meta charset="utf-8"></head>
<body>
<script>
  const PARENT_ORIGIN = "https://te87037.github.io";

  window.addEventListener("message", (event) => {
    if (event.origin !== PARENT_ORIGIN) return;
    const isSync = event.data?.type === "teachflow-sync-request";
    const isOcr = event.data?.type === "teachflow-ocr-request";
    if (!isSync && !isOcr) return;
    const requestId = event.data.requestId;
    const responseType = isOcr ? "teachflow-ocr-response" : "teachflow-sync-response";
    const runner = google.script.run
      .withSuccessHandler((result) => {
        event.source.postMessage({ type: responseType, requestId, result }, event.origin);
      })
      .withFailureHandler((error) => {
        event.source.postMessage({
          type: responseType,
          requestId,
          error: String(error?.message || error || (isOcr ? "OCR_FAILED" : "SYNC_FAILED"))
        }, event.origin);
      });
    if (isOcr) runner.recognizeTeachFlowPage(event.data.payload);
    else runner.syncTeachFlow(event.data.payload);
  });

  window.top.postMessage({ type: "teachflow-bridge-ready" }, PARENT_ORIGIN);
</script>
</body>
</html>
